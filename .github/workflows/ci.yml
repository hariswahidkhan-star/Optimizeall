name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      PGPASSWORD: postgres
      PYTHONPATH: apps/api/src
      PCIAI_ENVIRONMENT: test
      PCIAI_DATABASE_URL: postgresql+asyncpg://pciai_app:pciai_app@127.0.0.1:5432/pciai_test
      PCIAI_MIGRATION_DATABASE_URL: postgresql+asyncpg://pciai_owner:pciai_owner@127.0.0.1:5432/pciai_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e "apps/api[dev]"

      - name: Create roles and test database
        run: |
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f apps/api/scripts/bootstrap_db.sql
          createdb -h 127.0.0.1 -U postgres -O pciai_owner pciai_test
          psql -h 127.0.0.1 -U postgres -c "GRANT CONNECT ON DATABASE pciai_test TO pciai_app;"

      - name: Lint
        run: cd apps/api && ruff check . && ruff format --check .

      - name: Typecheck
        run: cd apps/api && python -m mypy

      - name: Test
        run: cd apps/api && python -m pytest -q

      - name: Migration round-trip
        # A migration without a working downgrade is a migration nobody can undo.
        run: cd apps/api && python -m alembic downgrade base && python -m alembic upgrade head
