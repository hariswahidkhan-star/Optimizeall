server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The application is a single-page app: any unmatched path is a client route, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset filenames change whenever their content does, so they can be cached
    # indefinitely. index.html must never be, or a deploy would not reach existing browsers.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Restrictive by default. 'unsafe-inline' for styles is required by the inline style objects the
    # components use; scripts get no such allowance, which is where injection actually matters.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
